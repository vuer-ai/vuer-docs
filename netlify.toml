[build]
base = "docs-site"
command = "python3 -m pip install -r requirements.txt && npm ci && npm run build"
publish = "dist/client"
[build.environment]
NODE_VERSION = "22"
PYTHON_VERSION = "3.12"
[[headers]]
for = "/versions.json"
[headers.values]
Access-Control-Allow-Origin = "*"

# Keep Read the Docs addon assets available to original /en/<version>/ pages.
[[redirects]]
from = "/_/static/*"
to = "https://vuer-py.readthedocs.io/_/static/:splat"
status = 200
